name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  # 重试时选择同一个 tag，禁止从分支凭空发布版本。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub2api-extension-release
  cancel-in-progress: false

jobs:
  quality-gate:
    name: 质量检查
    uses: ./.github/workflows/ci.yml

  release:
    name: 构建镜像、更新包并发布 Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: 校验标签并准备中文发布说明
        id: meta
        run: python3 .github/scripts/prepare-release.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建应用镜像
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=sub2api-extension-release
          cache-to: type=gha,mode=max,scope=sub2api-extension-release

      - name: 构建当前平台二进制更新包
        env:
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE_DATE: ${{ steps.meta.outputs.date }}
        run: bash .github/scripts/build-release-assets.sh

      - name: 发布中文 Release 与更新清单
        env:
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          IS_LATEST: ${{ steps.meta.outputs.latest }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: python3 .github/scripts/publish-release.py

      - name: 更新正式镜像别名
        if: steps.meta.outputs.latest == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$RELEASE_IMAGE:latest" "$RELEASE_IMAGE@$APP_DIGEST"

  notify-release:
    name: 通知飞书与邮件
    needs: [quality-gate, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FEISHU_RELEASE_WEBHOOK_URL: ${{ secrets.FEISHU_RELEASE_WEBHOOK_URL }}
      FEISHU_RELEASE_WEBHOOK_SECRET: ${{ secrets.FEISHU_RELEASE_WEBHOOK_SECRET }}
      RELEASE_RESULT: ${{ needs.release.result }}
      QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
      RELEASE_TAG: ${{ github.ref_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/notify-feishu.py
            .github/scripts/notify-email.py
          sparse-checkout-cone-mode: false

      - name: 发送飞书 Release 通知
        run: |
          if ! python3 .github/scripts/notify-feishu.py; then
            echo "::warning::飞书机器人通知发送失败，未影响 Release 结果"
          fi

      - name: 发送邮件 Release 通知
        env:
          RELEASE_EMAIL_TO: ${{ vars.RELEASE_EMAIL_TO }}
          RELEASE_SMTP_HOST: ${{ secrets.RELEASE_SMTP_HOST }}
          RELEASE_SMTP_PORT: ${{ secrets.RELEASE_SMTP_PORT }}
          RELEASE_SMTP_USERNAME: ${{ secrets.RELEASE_SMTP_USERNAME }}
          RELEASE_SMTP_PASSWORD: ${{ secrets.RELEASE_SMTP_PASSWORD }}
          RELEASE_SMTP_FROM: ${{ secrets.RELEASE_SMTP_FROM }}
        run: |
          if ! python3 .github/scripts/notify-email.py; then
            echo "::warning::邮件通知发送失败，未影响 Release 结果"
          fi
