name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  # 重试时选择同一个 tag，禁止从分支凭空发布版本。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sub2api-extension-release
  cancel-in-progress: false

jobs:
  quality-gate:
    name: 质量检查
    uses: ./.github/workflows/ci.yml

  release:
    name: 构建镜像并发布 Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: 校验标签并准备中文发布说明
        id: meta
        run: python3 .github/scripts/prepare-release.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建应用镜像
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=sub2api-extension-release
          cache-to: type=gha,mode=max,scope=sub2api-extension-release

      - name: 构建独立更新服务镜像
        id: updater
        uses: docker/build-push-action@v6
        with:
          context: .
          target: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-updater
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=sub2api-extension-release

      - name: 发布中文 Release 与更新清单
        env:
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
          IS_LATEST: ${{ steps.meta.outputs.latest }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: python3 .github/scripts/publish-release.py

      - name: 更新正式镜像别名
        if: steps.meta.outputs.latest == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$RELEASE_IMAGE:latest" "$RELEASE_IMAGE@$APP_DIGEST"
          docker buildx imagetools create --tag "$RELEASE_IMAGE:latest-updater" "$RELEASE_IMAGE@$UPDATER_DIGEST"
