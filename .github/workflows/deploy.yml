# =============================================================================
# Aux Content System - 生产环境部署流水线（单机）
# =============================================================================
# 构建单镜像（前端 + 后端合一），推送到 GHCR，再 SSH 到单台生产服务器，
# 通过 docker-compose.prod.yml 拉取新镜像并重启 aux-backend。
#
# 触发：仅手动（workflow_dispatch，选择 main 分支 + 填写版本号）。
#
# 架构：
#   ┌──────────────┐   push image   ┌─────────┐
#   │ GitHub CI    │ ──────────────→│  GHCR   │
#   │ Docker Build │                └────┬────┘
#   │ (multi-arch) │                     │ docker compose pull
#   └──────────────┘                     ▼
#                                ┌──────────────────────┐
#                                │  生产服务器（单机）    │
#                                │  docker-compose.prod  │
#                                │  aux-backend (单镜像)  │
#                                │  + health check       │
#                                └──────────────────────┘
#                                   │
#                                   └──→ 外部 PostgreSQL（不在 compose 内）
#                                   └──→ sub2api（同网络 / 公网域名）
#
# 部署的 docker-compose.prod.yml 不含数据库镜像，DATABASE_* 指向外部 PostgreSQL。
#
# 必需 Secrets（在 production Environment 配置）:
#   AUX_DEPLOY_HOST       - 生产服务器 IP/域名（单机）
#   AUX_DEPLOY_USER       - SSH 用户 (默认: root)
#   AUX_DEPLOY_PASSWORD   - SSH 密码
#   AUX_DEPLOY_PATH       - docker-compose.prod.yml 所在目录 (默认: /opt/aux-system)
#   GHCR_PAT              - GHCR 拉取用 PAT (read:packages)
#
# 可选 Secrets:
#   AUX_DEPLOY_PORT       - SSH 端口 (默认: 22)
# =============================================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0，作为镜像 tag）'
        required: true
        type: string
      skip_deploy:
        description: '仅构建推送镜像，跳过 SSH 部署'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ===========================================================================
  # Job 1: 构建并推送镜像到 GHCR
  # ===========================================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.version }}"
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ghcr_image=ghcr.io/${OWNER_LOWER}/aux-system" >> $GITHUB_OUTPUT

          echo "Image tag: ${TAG}"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.ghcr_image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.image_tag }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=aux-system
          cache-to: type=gha,mode=max,scope=aux-system

      - name: Build summary
        run: |
          echo "## Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Also tagged**: \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: \`${{ env.PLATFORMS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: SSH 部署到单台生产服务器
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      GHCR_IMAGE: ${{ needs.build-and-push.outputs.ghcr_image }}
      GHCR_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Deploy to production server (single machine)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AUX_DEPLOY_HOST }}
          username: ${{ secrets.AUX_DEPLOY_USER || 'root' }}
          password: ${{ secrets.AUX_DEPLOY_PASSWORD }}
          port: ${{ secrets.AUX_DEPLOY_PORT || '22' }}
          envs: GHCR_PAT,IMAGE_TAG,GHCR_IMAGE,GHCR_OWNER
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.AUX_DEPLOY_PATH || '/opt/aux-system' }}"
            cd "$DEPLOY_PATH"

            echo "==> Host: $(hostname) ($(hostname -I | awk '{print $1}'))"
            echo "==> Deploying version: ${IMAGE_TAG}"

            # 登录 GHCR（用传入的 PAT）
            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_OWNER" --password-stdin
            fi

            # 更新 .env.prod 中的镜像 tag，锁定本次部署版本
            if [ -f .env.prod ]; then
              if grep -q '^AUX_IMAGE_TAG=' .env.prod; then
                sed -i "s|^AUX_IMAGE_TAG=.*|AUX_IMAGE_TAG=${IMAGE_TAG}|" .env.prod
              else
                echo "AUX_IMAGE_TAG=${IMAGE_TAG}" >> .env.prod
              fi
              # 同步镜像名（防止 owner 变更后不一致）
              if grep -q '^AUX_IMAGE=' .env.prod; then
                sed -i "s|^AUX_IMAGE=.*|AUX_IMAGE=${GHCR_IMAGE}|" .env.prod
              else
                echo "AUX_IMAGE=${GHCR_IMAGE}" >> .env.prod
              fi
            else
              echo "❌ .env.prod 不存在，请先按 .env.prod.example 创建并配置"
              exit 1
            fi

            echo "==> Pulling image: ${GHCR_IMAGE}:${IMAGE_TAG}"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull aux-backend

            echo "==> Restarting aux-backend..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans aux-backend

            echo "==> Waiting for aux-backend to be healthy..."
            RETRIES=0
            MAX_RETRIES=30
            while [ $RETRIES -lt $MAX_RETRIES ]; do
              if docker compose -f docker-compose.prod.yml --env-file .env.prod ps aux-backend | grep -q "healthy"; then
                echo "✅ aux-backend is healthy on $(hostname)!"
                break
              fi
              RETRIES=$((RETRIES + 1))
              if [ $RETRIES -ge $MAX_RETRIES ]; then
                echo "❌ aux-backend health check timed out on $(hostname)"
                docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=50 aux-backend
                exit 1
              fi
              echo "  Waiting for health check... ($RETRIES/$MAX_RETRIES)"
              sleep 10
            done

            echo "==> Cleaning up old images..."
            docker image prune -f --filter "until=168h"

            echo "==> Deployment complete: ${IMAGE_TAG}"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.build-and-push.outputs.ghcr_image }}:${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Host**: \`${{ secrets.AUX_DEPLOY_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Path**: \`${{ secrets.AUX_DEPLOY_PATH || '/opt/aux-system' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
