# =============================================================================
# Sub2API Extension - CI 流水线
# =============================================================================
# 每次 push / PR 触发：后端单元测试 + golangci-lint，前端测试 + 类型检查 + 构建验证。
# 不构建 Docker 镜像；镜像由测试/生产部署工作流在质量门禁通过后构建。
#
# Go 版本锁定：从 backend/go.mod 读取（当前 1.26.5），并强制校验。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 测试/生产部署工作流会复用同一套质量门禁，确保镜像发布前测试全部通过。
  workflow_call:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 后端：单元测试
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        working-directory: backend
        run: go version | grep -q 'go1.26.5'

      - name: Run unit tests
        working-directory: backend
        # 不带 -tags=integration，自动跳过需要真实 PostgreSQL 的集成测试
        run: go test -race -count=1 ./...

  # ---------------------------------------------------------------------------
  # 后端：golangci-lint
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        working-directory: backend
        run: go version | grep -q 'go1.26.5'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  # ---------------------------------------------------------------------------
  # 前端：测试 + 类型检查 + 构建验证
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Run tests
        working-directory: frontend
        run: pnpm run test

      - name: Build verification
        working-directory: frontend
        # 构建产物在 frontend/dist；Dockerfile 会重新构建并嵌入后端镜像
        run: pnpm run build
