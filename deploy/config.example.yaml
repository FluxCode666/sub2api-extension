# =============================================================================
# Sub2API Extension - 配置示例
# =============================================================================
# 此文件是配置参考示例，说明附属系统后端（Go + viper）加载的配置项。
#
# 部署时优先使用环境变量（开发见 deploy/.env.dev.example，生产见 deploy/.env.example），Docker 部署无需手动写
# config.yaml —— Compose 的 environment 块已注入所有配置。
# 此文件供非 Docker 部署或本地开发参考。
#
# 配置加载逻辑（internal/config/config.go）：
#   1. viper 读取 config.yaml（当前目录或 ./config/ 下查找）
#   2. viper.AutomaticEnv() 环境变量覆盖（. → _，如 server.port → SERVER_PORT）
#   3. 两者都不提供时用 SetDefault 默认值
#   4. 必需项校验：database.host/user/dbname、jwt.secret
# =============================================================================

# ---- 服务器配置 ----
server:
  # 监听地址。容器内用 0.0.0.0。
  host: "0.0.0.0"
  # 监听端口。默认 8787。容器内固定 8787。
  port: 8787
  # 运行模式：debug / release。生产用 release。
  mode: "release"
  # 读请求头超时（秒）
  read_header_timeout: 30
  # 空闲超时（秒）
  idle_timeout: 120

# ---- 自有 PostgreSQL 配置 ----
# 独立于 sub2api 的 postgres，承载埋点、页面和图片资源索引表。
# Docker 部署时同网络用服务名 aux-postgres。
database:
  host: "aux-postgres"        # 同网络服务名；本地开发用 localhost
  port: 5432
  user: "aux"
  password: "change-me"        # 敏感：生产用环境变量 DATABASE_PASSWORD 覆盖
  dbname: "auxdb"
  sslmode: "disable"           # 同网络内通信无需 SSL；公网部署用 require

# ---- sub2api 对接配置 ----
# 附属系统经这些配置验证管理员身份。
sub2api:
  # sub2api 后端基础 URL。
  # 同 Docker 网络部署：http://sub2api:8080（服务名解析）
  # 公网部署：https://sub2api.example.com（sub2api 的公网域名）
  base_url: "http://sub2api:8080"


# ---- JWT 配置 ----
# 附属系统管理员会话的签名密钥与有效期。
# 管理员经 sub2api 身份转发验证后，附属系统签发自己的 JWT 会话（U3）。
jwt:
  # 签名密钥。重要：生产必须设置固定值，否则容器重启后会话失效。
  # 生成: openssl rand -hex 32
  # 敏感：生产用环境变量 JWT_SECRET 覆盖。
  secret: ""
  # 会话有效期（小时）。默认 24。
  expire_hour: 24

# ---- 上传资源文件存储 ----
# 图片二进制写入此目录，image_assets 表只保存相对路径。
assets:
  dir: "data/assets"
