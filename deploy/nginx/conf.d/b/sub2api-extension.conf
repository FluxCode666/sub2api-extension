# Sub2API Extension 生产站点反向代理。
#
# 部署前请将以下内容中的 aux.example.com 替换成真实域名，并准备证书：
#   /etc/nginx/certs/aux.example.com/fullchain.pem
#   /etc/nginx/certs/aux.example.com/privkey.pem
#
# docker-compose.yml 默认把 sub2api-extension 绑定到宿主机 127.0.0.1:8004，
# 因此这里使用 127.0.0.1:8004；不要在 NGINX 宿主机上使用 sub2api-extension 这个容器 DNS 名称。
upstream aux_system_app {
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name sub2api-extension.teralemo.com;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    # 可选的 ACME HTTP-01 验证目录。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sub2api-extension.teralemo.com;

    ssl_certificate /etc/nginx/certs/sub2api-extension.teralemo.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/sub2api-extension.teralemo.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/sub2api-extension.access.log main;
    error_log /var/log/nginx/sub2api-extension.error.log warn;

    # 首页和后台都可能被 sub2api 以 iframe 嵌入，因此不要添加 X-Frame-Options。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 统一反代请求头。放在 server 级别后，所有 proxy location 自动继承，
    # 无需额外维护独立 snippets 文件。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Trace-Id $trace_id;
    proxy_set_header Connection "";

    location = /nginx-health {
        access_log off;
        return 204;
    }

    location = /health {
        access_log off;
        proxy_pass http://aux_system_app;
    }

    # Vite 产物使用内容哈希命名，可以长期缓存。
    location ^~ /assets/ {
        proxy_pass http://aux_system_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 图片资源使用不可变数字 ID，允许浏览器和 CDN 长期缓存。
    # URL 由页面资源页按当前站点 origin 拼接，因此 iframe/外链场景会使用本域名。
    location ^~ /api/aux/assets/ {
        proxy_pass http://aux_system_app;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 公开页面、管理 API、埋点和登录请求均保持原始路径转发。
    location /api/ {
        proxy_pass http://aux_system_app;
    }

    # React SPA 与数据库动态页面：后端负责静态资源和 history fallback。
    location / {
        proxy_pass http://aux_system_app;
    }
}
