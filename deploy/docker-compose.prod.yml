# =============================================================================
# Aux Content System - 生产环境 Docker Compose（单机，不含数据库）
# =============================================================================
# 生产部署用。仅运行 aux-backend（后端 + 内嵌前端单镜像），从 GHCR 拉取镜像。
# 不包含 PostgreSQL 镜像——数据库由外部提供（sub2api 的 postgres / 独立 RDS / 自建实例）。
#
# 与 deploy/docker-compose.yml（开发用，含 postgres、从源码 build）的区别：
#   - 仅 aux-backend 一个服务
#   - image 从 GHCR 拉取（${AUX_IMAGE}:${AUX_IMAGE_TAG}），不 build
#   - DATABASE_* 指向外部 PostgreSQL
#
# 网络互联：
#   加入 sub2api 的 sub2api-network（external）。
#   - sub2api 经此网络以 iframe URL 访问附属系统（同网络用 http://aux-backend:8787）
#   - 附属系统经此网络访问 sub2api（http://sub2api:8080）
#   若 sub2api 与本系统不在同一 Docker 网络，将 SUB2API_BASE_URL 改为 sub2api 公网域名，
#   并将下方 sub2api-network 改为本地网络（见文末注释）。
#
# 快速开始：
#   1. cp .env.prod.example .env.prod  并填写实际值
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   3. 查看日志: docker compose -f docker-compose.prod.yml logs -f aux-backend
#   4. 健康检查: curl http://localhost:${AUX_SERVER_PORT:-8787}/health
# =============================================================================

services:
  aux-backend:
    image: ${AUX_IMAGE:?AUX_IMAGE is required}:${AUX_IMAGE_TAG:?AUX_IMAGE_TAG is required}
    container_name: aux-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-100m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${AUX_SERVER_PORT:-8787}:8787"
    environment:
      # ---- 服务器配置 ----
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8787
      - SERVER_MODE=${SERVER_MODE:-release}

      # ---- 外部 PostgreSQL 连接（不在此 compose 内运行）----
      # 指向外部数据库：同 Docker 网络用服务名（如 sub2api-postgres），否则用 IP/域名。
      - DATABASE_HOST=${DATABASE_HOST:?DATABASE_HOST is required}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:?DATABASE_USER is required}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - DATABASE_DBNAME=${DATABASE_DBNAME:?DATABASE_DBNAME is required}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE:-disable}

      # ---- sub2api 对接 ----
      # 同 Docker 网络部署用 http://sub2api:8080；否则用 sub2api 公网域名。
      - SUB2API_BASE_URL=${SUB2API_BASE_URL:?SUB2API_BASE_URL is required}
      - SUB2API_ADMIN_API_KEY=${SUB2API_ADMIN_API_KEY:?SUB2API_ADMIN_API_KEY is required}

      # ---- JWT 配置（附属系统管理员会话签名）----
      # 重要：设置固定 JWT_SECRET，避免容器重启后会话失效。生成: openssl rand -hex 32
      - JWT_SECRET=${AUX_JWT_SECRET:?AUX_JWT_SECRET is required}
      - JWT_EXPIRE_HOUR=${AUX_JWT_EXPIRE_HOUR:-24}

      # ---- 前端静态托管（Dockerfile 已默认设置，这里显式声明）----
      - AUX_FRONTEND_DIST=/app/frontend/dist

      # ---- 时区 ----
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8787/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# =============================================================================
# Networks
# =============================================================================
# sub2api-network 是 sub2api 的 deploy/docker-compose.yml 创建的 bridge 网络。
# 声明为 external：附属系统加入此网络以与 sub2api 互联，不重复创建。
#
# 若生产环境中 sub2api 不在同一 Docker 网络（如 sub2api 部署在另一台机器）：
#   1. 将 SUB2API_BASE_URL 改为 sub2api 公网域名（如 https://sub2api.example.com）
#   2. 将下方网络改为本地网络（删除 external/name，改为普通定义）：
#        networks:
#          default:
#            driver: bridge
networks:
  sub2api-network:
    external: true
    name: sub2api-network
