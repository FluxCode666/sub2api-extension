# =============================================================================
# Sub2API Extension Development Docker Compose Configuration
# =============================================================================
# 附属内容承载系统部署。零侵入 sub2api，独立运行。
#
# 三个服务：
#   - aux-postgres: 附属系统自有 PostgreSQL（独立库，不复用 sub2api 的 postgres）
#   - aux-migrate:  附属系统数据库 schema 一次性迁移
#   - aux-backend:  附属系统后端（内嵌前端 dist，单进程同源托管）
#
# 网络互联：
#   加入 sub2api 的 Compose 网络（external）。默认值
#   deploy_sub2api-network 对应在 sub2api/deploy 目录运行 docker-compose.dev.yml
#   时的项目网络；如果使用了其他 Compose project name，请通过
#   SUB2API_DOCKER_NETWORK 覆盖。
#   - 容器间可通过 aux-backend / sub2api 服务名通信；浏览器 iframe 必须使用
#     SUB2API_EXTENSION_PUBLIC_URL，不能把 aux-backend 作为浏览器地址。
#   - 附属系统经此网络访问 sub2api（http://sub2api:8080）和 PostgreSQL（postgres:5432）
#
# 前置条件：
#   sub2api 已通过其自身的 Compose 文件部署，SUB2API_DOCKER_NETWORK 已存在。
#
# 快速开始：
#   1. 复制 .env.dev.example 到 .env.dev 并配置
#   2. docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
#   3. 检查日志: docker compose -f docker-compose.dev.yml --env-file .env.dev logs -f aux-backend
#   4. 健康检查: curl http://localhost:${SUB2API_EXTENSION_SERVER_PORT:-8787}/health
# =============================================================================

name: sub2api-extension-dev

services:
  # ===========================================================================
  # Aux PostgreSQL（附属系统自有数据库）
  # ===========================================================================
  # 独立于 sub2api 的 postgres，承载 page_view / feature_click 等埋点表。
  # 不复用 sub2api 数据库，满足「自有数据库」要求（R1）。
  aux-postgres:
    image: postgres:18-alpine
    container_name: aux-postgres
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - aux-postgres-data:/var/lib/postgresql/data
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${SUB2API_EXTENSION_POSTGRES_USER:-aux}
      - POSTGRES_PASSWORD=${SUB2API_EXTENSION_POSTGRES_PASSWORD:?SUB2API_EXTENSION_POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${SUB2API_EXTENSION_POSTGRES_DB:-auxdb}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    # 仅允许宿主机访问（调试用）
    ports:
      - "127.0.0.1:${SUB2API_EXTENSION_POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SUB2API_EXTENSION_POSTGRES_USER:-aux} -d ${SUB2API_EXTENSION_POSTGRES_DB:-auxdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Aux schema migration（一次性）
  # ===========================================================================
  # 后端启动不会自动迁移。开发 Compose 在启动应用前显式执行 -migrate，
  # 只修改附属系统自己的 auxdb，不会修改 Sub2API 数据库。
  aux-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sub2api-extension:latest
    restart: "no"
    command: ["-migrate"]
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8787
      - SERVER_MODE=${SERVER_MODE:-release}
      - DATABASE_HOST=aux-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${SUB2API_EXTENSION_POSTGRES_USER:-aux}
      - DATABASE_PASSWORD=${SUB2API_EXTENSION_POSTGRES_PASSWORD:?SUB2API_EXTENSION_POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${SUB2API_EXTENSION_POSTGRES_DB:-auxdb}
      - DATABASE_SSLMODE=disable
      # config.Load 在 -migrate 模式仍要求这两个配置存在。
      - SUB2API_BASE_URL=${SUB2API_BASE_URL:-http://sub2api:8080}
      - JWT_SECRET=${SUB2API_EXTENSION_JWT_SECRET:?SUB2API_EXTENSION_JWT_SECRET is required}
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      aux-postgres:
        condition: service_healthy
    networks:
      - sub2api-network

  # ===========================================================================
  # Aux Backend（附属系统应用：后端 + 内嵌前端）
  # ===========================================================================
  # 多阶段 Dockerfile 构建的单镜像：后端 Go 二进制 + 前端 dist。
  # 后端通过 SUB2API_EXTENSION_FRONTEND_DIST=/app/frontend/dist 同源托管前端 SPA。
  # 前端 api-client 使用相对路径 /api/aux，同源避免 CORS。
  aux-backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sub2api-extension:latest
    container_name: aux-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SUB2API_EXTENSION_SERVER_PORT:-8787}:8787"
    environment:
      # ---- 服务器配置 ----
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8787
      - SERVER_MODE=${SERVER_MODE:-release}

      # ---- 自有 PostgreSQL 连接（同网络用服务名 aux-postgres）----
      - DATABASE_HOST=aux-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${SUB2API_EXTENSION_POSTGRES_USER:-aux}
      - DATABASE_PASSWORD=${SUB2API_EXTENSION_POSTGRES_PASSWORD:?SUB2API_EXTENSION_POSTGRES_PASSWORD is required}
      - DATABASE_DBNAME=${SUB2API_EXTENSION_POSTGRES_DB:-auxdb}
      - DATABASE_SSLMODE=disable

      # ---- sub2api 对接（同网络用 http://sub2api:8080）----
      # BaseURL: sub2api 后端地址。同 Docker 网络部署用 http://sub2api:8080；
      #          若附属系统与 sub2api 不在同一网络，用 sub2api 的公网域名。
      - SUB2API_BASE_URL=${SUB2API_BASE_URL:-http://sub2api:8080}
      # ---- sub2api 数据库（页面上架同步 settings.custom_menu_items）----
      - SUB2API_DATABASE_HOST=${SUB2API_DATABASE_HOST:-}
      - SUB2API_DATABASE_PORT=${SUB2API_DATABASE_PORT:-5432}
      - SUB2API_DATABASE_USER=${SUB2API_DATABASE_USER:-}
      - SUB2API_DATABASE_PASSWORD=${SUB2API_DATABASE_PASSWORD:-}
      - SUB2API_DATABASE_DBNAME=${SUB2API_DATABASE_DBNAME:-}
      - SUB2API_DATABASE_SSLMODE=${SUB2API_DATABASE_SSLMODE:-disable}
      - SUB2API_EXTENSION_PUBLIC_URL=${SUB2API_EXTENSION_PUBLIC_URL:-}
      - SUB2API_EXTENSION_COST_SYNC_INTERVAL_SECONDS=${SUB2API_EXTENSION_COST_SYNC_INTERVAL_SECONDS:-300}
      # ---- JWT 配置（附属系统管理员会话签名）----
      # 重要：设置固定 JWT_SECRET，避免容器重启后会话失效。
      # 生成: openssl rand -hex 32
      - JWT_SECRET=${SUB2API_EXTENSION_JWT_SECRET:?SUB2API_EXTENSION_JWT_SECRET is required}
      - JWT_EXPIRE_HOUR=${SUB2API_EXTENSION_JWT_EXPIRE_HOUR:-24}

      # ---- 前端静态托管（Dockerfile 已默认设置，这里显式声明）----
      - SUB2API_EXTENSION_FRONTEND_DIST=${SUB2API_EXTENSION_FRONTEND_DIST:-/app/frontend/dist}

      # ---- 上传资源根目录：图片在 photos/，发票在 invoices/ ----
      - SUB2API_EXTENSION_ASSET_DIR=${SUB2API_EXTENSION_ASSET_DIR:-/app/data/assets}

      # ---- 时区 ----
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      aux-postgres:
        condition: service_healthy
      aux-migrate:
        condition: service_completed_successfully
    networks:
      - sub2api-network
    volumes:
      - sub2api-extension-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8787/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  aux-postgres-data:
    driver: local
  sub2api-extension-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
# sub2api-network 是 sub2api 自身的 Compose 文件创建的 bridge 网络。
# 声明为 external：附属系统加入此网络以与 sub2api 互联，不重复创建。
# sub2api 与附属系统共享此网络；浏览器 iframe URL 仍由
# SUB2API_EXTENSION_PUBLIC_URL 提供，不能使用 aux-backend 这类容器内部名称。
# 附属系统经此网络用 http://sub2api:8080 访问 sub2api。
networks:
  sub2api-network:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:-deploy_sub2api-network}
